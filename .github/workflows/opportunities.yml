name: Opportunity scanner

# Ranks long/short setups across ~120 US stocks and ETFs using FMP prices,
# ORTEX short-interest flow and a backtest of each setup on the same
# universe. Publishes opportunities.md/.json to the budsignal-data branch,
# the job summary and an artifact; optionally sends a Telegram digest.
# Secrets: FMP_API_KEY (required), ORTEX_API_KEY (optional),
#          TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID (optional digest).
# Variables (optional): ACCOUNT_GBP, RISK_PCT.

on:
  schedule:
    - cron: '20 21 * * 1-5'   # after the US close, once daily bars are final
  workflow_dispatch:
    inputs:
      account_gbp:
        description: 'Account size in GBP (blank = ACCOUNT_GBP variable or 1000)'
        default: ''
      extra_symbols:
        description: 'Extra symbols to scan, comma-separated'
        default: ''
      telegram:
        description: 'Send the Telegram digest'
        type: boolean
        default: true
  push:
    branches: ['claude/**']
    paths:
      - 'budsignal/opportunities.mjs'
      - '.github/workflows/opportunities.yml'

permissions:
  contents: write

concurrency:
  group: opportunity-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore Telegram chat ids from the notifier
        uses: actions/cache/restore@v4
        with:
          path: .notify-state.json
          key: budsignal-notify-state-none
          restore-keys: budsignal-notify-state-
      - name: Scan
        run: node budsignal/opportunities.mjs
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ORTEX_API_KEY: ${{ secrets.ORTEX_API_KEY }}
          ORTEX_BUDGET: '12'
          ACCOUNT_GBP: ${{ inputs.account_gbp || vars.ACCOUNT_GBP || '1000' }}
          RISK_PCT: ${{ vars.RISK_PCT || '1' }}
          HOLDINGS: 'AMC,SNDL'
          EXTRA_SYMBOLS: ${{ inputs.extra_symbols }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TELEGRAM: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.telegram)) && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        with:
          name: opportunities
          path: |
            opportunities.md
            opportunities.json
          retention-days: 14
      - name: Publish to budsignal-data branch
        if: github.event_name != 'push'
        run: |
          set -e
          git config user.name 'budsignal-bot'
          git config user.email 'actions@users.noreply.github.com'
          # The notifier also commits to this branch; retry on a lost race.
          for attempt in 1 2 3; do
            git fetch origin budsignal-data
            MD=$(git hash-object -w opportunities.md)
            JS=$(git hash-object -w opportunities.json)
            { git ls-tree origin/budsignal-data | grep -v -e $'\topportunities.md$' -e $'\topportunities.json$' || true;
              printf '100644 blob %s\topportunities.md\n' "$MD";
              printf '100644 blob %s\topportunities.json\n' "$JS"; } | git mktree > /tmp/tree
            COMMIT=$(git commit-tree "$(cat /tmp/tree)" -p "$(git rev-parse origin/budsignal-data)" -m "opportunity scan $(date -u +%FT%TZ)")
            git push origin "$COMMIT:refs/heads/budsignal-data" && exit 0
            sleep $((attempt * 5))
          done
          exit 1
