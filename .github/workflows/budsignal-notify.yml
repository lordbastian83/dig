name: BudSignal alerts & performance tracking

# Runs a few minutes after each 4h candle closes (00:00, 04:00, ... UTC):
#  1. messages the configured Telegram chat when a signal fired on that candle
#  2. updates the append-only performance ledger on the budsignal-data branch,
#     which the site's "Live performance" section reads
# Setup (repo Settings -> Secrets and variables -> Actions):
#   TELEGRAM_BOT_TOKEN  (required for alerts) bot token from @BotFather
#   TELEGRAM_CHAT_ID    (optional) numeric chat id; auto-resolved from the
#                       handle below if omitted — the user must have pressed
#                       Start on the bot first
#   FMP_API_KEY         (optional) enables GOLD / US30 / GBPUSD

on:
  schedule:
    - cron: '7 */4 * * *'   # signal + resolution alerts, ledger update
    - cron: '9 * * * *'     # hourly: validated 1h scalp stream only
    - cron: '15 0 * * 1'    # Monday weekly digest
    - cron: '15 20 * * *'   # daily heartbeat
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a connectivity test message'
        type: boolean
        default: false
      heartbeat:
        description: 'Send the daily heartbeat now'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: budsignal-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore notifier state (chat id + dedupe)
        uses: actions/cache@v4
        with:
          path: .notify-state.json
          key: budsignal-notify-state-${{ github.run_id }}
          restore-keys: budsignal-notify-state-
      - name: Hourly scalp check (validated 1h stream)
        if: ${{ github.event.schedule == '9 * * * *' }}
        run: SCALP_ONLY=1 node budsignal/notify.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_HANDLE: 'Lordbastian83'
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ACCOUNT_GBP: '3500'
          RISK_PCT: '1'
      - name: Compute signals and notify
        if: ${{ github.event.schedule != '15 0 * * 1' && github.event.schedule != '15 20 * * *' && github.event.schedule != '9 * * * *' && !inputs.heartbeat }}
        run: node budsignal/notify.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_HANDLE: 'Lordbastian83'
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ACCOUNT_GBP: '3500'   # sizing for the £ trade plan in alerts
          RISK_PCT: '1'
          SEND_TEST: ${{ inputs.test && '1' || '' }}
      - name: Weekly digest
        if: ${{ github.event.schedule == '15 0 * * 1' }}
        run: |
          git fetch origin budsignal-data 2>/dev/null || true
          git show origin/budsignal-data:performance.json > performance.json 2>/dev/null || true
          DIGEST=1 LEDGER_FILE=performance.json node budsignal/notify.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Daily heartbeat
        if: ${{ github.event.schedule == '15 20 * * *' || inputs.heartbeat }}
        run: HEARTBEAT=1 node budsignal/notify.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Update performance ledger (budsignal-data branch)
        if: ${{ !inputs.test && !inputs.heartbeat && github.event.schedule != '15 0 * * 1' && github.event.schedule != '15 20 * * *' && github.event.schedule != '9 * * * *' }}
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          set -e
          git config user.name 'budsignal-bot'
          git config user.email 'actions@users.noreply.github.com'
          if ! git ls-remote --exit-code origin budsignal-data >/dev/null 2>&1; then
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            INIT=$(git commit-tree "$EMPTY_TREE" -m 'init performance ledger')
            git push origin "$INIT:refs/heads/budsignal-data"
          fi
          git fetch origin budsignal-data
          git show origin/budsignal-data:performance.json > performance.json 2>/dev/null || true
          git show origin/budsignal-data:market-metrics.json > market-metrics.json 2>/dev/null || true
          LEDGER_FILE=performance.json METRICS_FILE=market-metrics.json node budsignal/track.mjs
          PERF_BLOB=$(git hash-object -w performance.json)
          METRICS_BLOB=$(git hash-object -w market-metrics.json)
          # concurrent publishers are routine (sibling kickers) — on a lost
          # race, re-parent on the new tip and push again. The ledger blobs
          # are already written; only the tree parent changes per attempt.
          for attempt in 1 2 3; do
            git fetch origin budsignal-data
            # preserve every other file on the branch (research report, ML model)
            { git ls-tree origin/budsignal-data | grep -v -e $'\tperformance.json$' -e $'\tmarket-metrics.json$' || true;
              printf '100644 blob %s\tperformance.json\n' "$PERF_BLOB";
              printf '100644 blob %s\tmarket-metrics.json\n' "$METRICS_BLOB"; } | git mktree > /tmp/tree
            COMMIT=$(git commit-tree "$(cat /tmp/tree)" -p "$(git rev-parse origin/budsignal-data)" -m "ledger update $(date -u +%FT%TZ)")
            git push origin "$COMMIT:refs/heads/budsignal-data" && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      # See budsignal-rss.yml: one delivered cron heals the whole data plane.
      - name: Kick overdue sibling feeds
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin budsignal-data 2>/dev/null || true
          now=$(date +%s)
          age_s() {
            git show "origin/budsignal-data:$1" 2>/dev/null | python3 -c '
          import json, sys
          try: print(int(json.load(sys.stdin).get("updated", 0) // 1000))
          except Exception: print(0)'
          }
          kick() {
            echo "::notice::$1 is overdue - dispatching $2"
            curl -sS -o /dev/null -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$2/dispatches" \
              -d '{"ref":"master"}' || true
          }
          check() {
            u=$(age_s "$1")
            if [ $(( now - u )) -gt "$2" ]; then kick "$1" "$3"; else echo "$1 fresh"; fi
          }
          check wire-rss.json 5400 budsignal-rss.yml
          check candles.json 7200 budsignal-candles.yml
          check intel.json 23400 budsignal-intel.yml
