name: Bloodstock catalogue watch

# Daily check of sale-house pages; opens a GitHub issue when one changes
# (catalogue drop / lots published) — GitHub emails you natively, no bot.
# State (page hashes) is committed to the bloodstock-data branch so each
# change alerts exactly once.

on:
  schedule:
    - cron: '20 7 * * *'   # 07:20 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: bloodstock-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore watch state from bloodstock-data branch
        run: |
          git fetch origin bloodstock-data --depth 1 || true
          git show origin/bloodstock-data:watch-state.json > watch-state.json 2>/dev/null || echo '{}' > watch-state.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run watcher
        run: node bloodstock/watch.mjs
        env:
          STATE_FILE: watch-state.json
          CHANGES_FILE: changes.txt

      - name: Open issue on change
        if: hashFiles('changes.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="$(cat changes.txt)

          A sale page changed — likely a catalogue drop. Next step: run the **Bloodstock catalogue ingest** workflow to scrape and score it, then open the scanner and hit **Rank by value gap**."
          # the run summary carries the alert even when the issue POST cannot
          # (e.g. Issues disabled on the repo), so a red run is still readable
          { echo "## 🐎 Catalogue watch: sale page changed"; echo; echo "$BODY"; } >> "$GITHUB_STEP_SUMMARY"
          code=$(curl -s -o /tmp/resp -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues" \
            -d "$(BODY="$BODY" node -e 'console.log(JSON.stringify({title: "🐎 Catalogue watch: sale page changed "+new Date().toISOString().slice(0,10), body: process.env.BODY}))')")
          if [ "$code" != "201" ]; then
            echo "::error::Issue POST failed (HTTP $code) - if 410, Issues are disabled: enable them under repo Settings -> General -> Features. Change details are in this run's summary."
            cat /tmp/resp
            exit 1
          fi

      - name: Persist state to bloodstock-data branch
        run: |
          git config user.name 'bloodstock-watch[bot]'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin bloodstock-data:refs/remotes/origin/bloodstock-data || true
          if git rev-parse --verify refs/remotes/origin/bloodstock-data >/dev/null 2>&1; then
            git worktree add data origin/bloodstock-data
            cd data && git checkout -B bloodstock-data
          else
            git worktree add --orphan -b bloodstock-data data 2>/dev/null \
              || { git worktree add --detach data && cd data && git checkout --orphan bloodstock-data && git rm -rf --quiet . 2>/dev/null; cd ..; }
            cd data
          fi
          cp ../watch-state.json .
          git add watch-state.json
          git commit -m "watch-state $(date -u +%F)" || exit 0
          git push origin bloodstock-data
