name: Bloodstock catalogue watch

# Daily check of sale-house pages. When one changes (catalogue drop / lots
# published) the change goes in the run summary and, where Issues are enabled,
# a GitHub issue (GitHub emails you natively, no bot). Issues are disabled on
# this repo today, so the issue step warns and moves on rather than failing.
# State (page hashes) is committed to the bloodstock-data branch whenever it
# changed — even if the alert step failed — so each change alerts exactly once.

on:
  schedule:
    - cron: '20 7 * * *'   # 07:20 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: bloodstock-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore watch state from bloodstock-data branch
        id: restore
        run: |
          git fetch origin bloodstock-data --depth 1 || true
          git show origin/bloodstock-data:watch-state.json > watch-state.json 2>/dev/null || echo '{}' > watch-state.json
          # what we started from, so "Persist state" can tell whether the watcher actually changed anything
          cp watch-state.json "$RUNNER_TEMP/watch-state.restored.json"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run watcher
        run: node bloodstock/watch.mjs
        env:
          STATE_FILE: watch-state.json
          CHANGES_FILE: changes.txt

      # The alert is best-effort and must never block "Persist state": Issues are disabled on this repo, so the
      # POST has answered 410 every day since 13 Nov, the step failed, Persist was skipped, and the same change
      # re-alerted (and failed) the next morning. The change itself is always written to the run summary first.
      - name: Open issue on change
        if: hashFiles('changes.txt') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="$(cat changes.txt)

          A sale page changed — likely a catalogue drop. Next step: run the **Bloodstock catalogue ingest** workflow to scrape and score it, then open the scanner and hit **Rank by value gap**."
          # the run summary carries the alert even when the issue POST cannot
          # (e.g. Issues disabled on the repo), so a red run is still readable
          { echo "## 🐎 Catalogue watch: sale page changed"; echo; echo "$BODY"; } >> "$GITHUB_STEP_SUMMARY"
          code=$(curl -s -o /tmp/resp -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues" \
            -d "$(BODY="$BODY" node -e 'console.log(JSON.stringify({title: "🐎 Catalogue watch: sale page changed "+new Date().toISOString().slice(0,10), body: process.env.BODY}))')")
          case "$code" in
            201)
              echo "issue opened" ;;
            410|403)
              # Issues disabled (410) or not permitted (403): expected on this repo, not a failure.
              { echo; echo "> No issue opened: the Issues API answered HTTP $code (Issues disabled on this repo, or not permitted). This summary is the alert."; } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::No issue opened (HTTP $code: Issues disabled or not permitted). The change is in this run's summary; state is still saved."
              exit 0 ;;
            *)
              # anything else (5xx, network) is worth a look, but continue-on-error keeps it from blocking Persist
              { echo; echo "> Issue POST failed (HTTP ${code:-none}). The change is above; state is still saved."; } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Issue POST failed (HTTP ${code:-none}). Change details are in this run's summary."
              cat /tmp/resp 2>/dev/null || true
              exit 1 ;;
          esac

      # always(): saved even when the alert step (or anything before it) failed, so a change alerts once, not daily.
      # Only when the state really changed, and only from a state that was actually restored, so a crashed watcher
      # (it writes the file last) or a broken restore never pushes a blank or stale state over the good one.
      - name: Persist state to bloodstock-data branch
        if: ${{ always() && steps.restore.outcome == 'success' && hashFiles('watch-state.json') != '' }}
        run: |
          if cmp -s watch-state.json "$RUNNER_TEMP/watch-state.restored.json"; then
            echo "watch state unchanged: nothing to persist"; exit 0
          fi
          git config user.name 'bloodstock-watch[bot]'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin bloodstock-data:refs/remotes/origin/bloodstock-data || true
          if git rev-parse --verify refs/remotes/origin/bloodstock-data >/dev/null 2>&1; then
            git worktree add data origin/bloodstock-data
            cd data && git checkout -B bloodstock-data
          else
            git worktree add --orphan -b bloodstock-data data 2>/dev/null \
              || { git worktree add --detach data && cd data && git checkout --orphan bloodstock-data && git rm -rf --quiet . 2>/dev/null; cd ..; }
            cd data
          fi
          cp ../watch-state.json .
          git add watch-state.json
          git commit -m "watch-state $(date -u +%F)" || exit 0
          git push origin bloodstock-data
