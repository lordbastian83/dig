# BudSignal RSS wire — fetches public finance RSS feeds every 30 minutes
# and publishes wire-rss.json to the budsignal-data branch. The site reads
# it from raw.githubusercontent (feeds themselves have no CORS headers, so
# the browser cannot fetch them directly). No API key involved.
name: BudSignal RSS wire

on:
  schedule:
    # every 15 minutes, not because the wire needs it, but because GitHub
    # drops scheduled events under load: each delivered run is also the
    # data plane's healer (the kicker step below), so more cron tickets
    # mean faster recovery for every feed. The run itself is keyless and
    # takes ~20s.
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: budsignal-rss
  cancel-in-progress: false

jobs:
  rss:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      # previous publish seeds the og:image cache, so article pages are
      # fetched once per story, not once per run
      - name: Restore previous wire
        run: |
          git fetch origin budsignal-data
          git show origin/budsignal-data:wire-rss.json > wire-rss-prev.json || true

      - name: Fetch and normalize feeds
        run: |
          RSS_FILE=wire-rss.json RSS_PREV=wire-rss-prev.json node budsignal/rss.mjs

      - name: Publish to budsignal-data branch
        run: |
          set -e
          git config user.name 'budsignal-bot'
          git config user.email 'actions@users.noreply.github.com'
          # Several workflows commit distinct files to this branch, and the
          # sibling kickers make concurrent publishers routine — on a lost
          # race, re-parent the same blob on the new tip and push again.
          for attempt in 1 2 3; do
            git fetch origin budsignal-data
            RSS_BLOB=$(git hash-object -w wire-rss.json)
            # preserve every other file on the branch
            { git ls-tree origin/budsignal-data | grep -v -e $'\twire-rss.json$' || true;
              printf '100644 blob %s\twire-rss.json\n' "$RSS_BLOB"; } | git mktree > /tmp/tree
            COMMIT=$(git commit-tree "$(cat /tmp/tree)" -p "$(git rev-parse origin/budsignal-data)" -m "rss wire $(date -u +%FT%TZ)")
            git push origin "$COMMIT:refs/heads/budsignal-data" && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      # GitHub cron delivery gets throttled for hours at a time (the whole
      # data plane went quiet 01:26-05:08 UTC on 2026-09-27 with zero
      # failures). Whichever feed DOES get a run uses it to re-dispatch any
      # sibling whose published file is overdue, so one delivered cron heals
      # the whole plane. workflow_dispatch created with GITHUB_TOKEN is the
      # documented exception that does trigger runs.
      - name: Kick overdue sibling feeds
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin budsignal-data 2>/dev/null || true
          now=$(date +%s)
          age_s() {
            git show "origin/budsignal-data:$1" 2>/dev/null | python3 -c '
          import json, sys
          try: print(int(json.load(sys.stdin).get("updated", 0) // 1000))
          except Exception: print(0)'
          }
          kick() {
            echo "::notice::$1 is overdue - dispatching $2"
            curl -sS -o /dev/null -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$2/dispatches" \
              -d '{"ref":"master"}' || true
          }
          check() {
            u=$(age_s "$1")
            if [ $(( now - u )) -gt "$2" ]; then kick "$1" "$3"; else echo "$1 fresh"; fi
          }
          check candles.json 7200 budsignal-candles.yml
          check performance.json 21600 budsignal-notify.yml
          check intel.json 27000 budsignal-intel.yml
