name: Bloodstock catalogue ingest

# Manual pipeline: scrape a catalogue (or use a committed/uploaded CSV),
# enrich every lot via The Racing API (Pro credentials from repo secrets),
# and publish the scored lots.json + the CSV to the bloodstock-data branch.
# Load lots.json into the app via its "Restore JSON" button.
#
# Secrets required (Settings -> Secrets -> Actions):
#   RACING_API_USERNAME / RACING_API_PASSWORD   - The Racing API Pro

on:
  workflow_dispatch:
    inputs:
      catalogue_url:
        description: 'Sale lots index URL to scrape (leave empty to use bloodstock/catalogue.csv from the repo)'
        required: false
        default: ''
      debug:
        description: 'Log API response shapes (1 = on)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scrape catalogue
        if: inputs.catalogue_url != ''
        run: node bloodstock/scrape-tattersalls.mjs "${{ inputs.catalogue_url }}"

      - name: Use committed catalogue
        if: inputs.catalogue_url == ''
        run: |
          if [ -f bloodstock/catalogue.csv ]; then
            cp bloodstock/catalogue.csv catalogue.csv
          else
            echo "No catalogue_url given and bloodstock/catalogue.csv not found." >&2
            exit 1
          fi

      - name: Enrich via The Racing API
        env:
          RACING_API_USERNAME: ${{ secrets.RACING_API_USERNAME }}
          RACING_API_PASSWORD: ${{ secrets.RACING_API_PASSWORD }}
          CATALOGUE: catalogue.csv
          OUT: lots.json
          DEBUG: ${{ inputs.debug }}
        run: node bloodstock/ingest.mjs

      - name: Publish to bloodstock-data branch
        run: |
          git config user.name 'bloodstock-ingest[bot]'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin bloodstock-data:refs/remotes/origin/bloodstock-data || true
          if git rev-parse --verify refs/remotes/origin/bloodstock-data >/dev/null 2>&1; then
            git worktree add data origin/bloodstock-data
            cd data && git checkout -B bloodstock-data
          else
            git worktree add --orphan -b bloodstock-data data 2>/dev/null \
              || { git worktree add --detach data && cd data && git checkout --orphan bloodstock-data && git rm -rf --quiet . 2>/dev/null; cd ..; }
            cd data
          fi
          cp ../lots.json ../catalogue.csv .
          git add lots.json catalogue.csv
          git commit -m "ingest $(date -u +%F)" || exit 0
          git push origin bloodstock-data
