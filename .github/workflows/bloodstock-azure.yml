name: Deploy Bloodstock Scanner to Azure Static Web Apps

# One-time setup (Azure portal):
#   1. Create resource -> Static Web App -> Free plan, any region.
#      Deployment source: "Other" (this workflow pushes the files itself).
#   2. After it deploys, open the resource -> "Manage deployment token" and
#      copy the token.
#   3. GitHub repo -> Settings -> Secrets and variables -> Actions -> add
#      secret AZURE_STATIC_WEB_APPS_API_TOKEN_BLOODSTOCK with that token.
#   4. Run this workflow (Actions tab -> "Run workflow") or push to master
#      touching bloodstock/app/**. The app URL is on the resource overview.

on:
  push:
    branches: [master]
    paths:
      - 'bloodstock/app/**'
      - '.github/workflows/bloodstock-azure.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bloodstock-azure
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLOODSTOCK }}
          action: upload
          app_location: bloodstock/app
          output_location: ''
          skip_app_build: true
